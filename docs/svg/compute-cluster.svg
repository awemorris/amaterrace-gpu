<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#131B2E" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" opacity="0.5" />
    </pattern>

    <!-- Node Gradients -->
    <linearGradient id="hostGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="switchGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#581C87" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="shaderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Canvas Base -->
  <rect width="1280" height="720" fill="url(#bgGrad)" />
  <rect width="1280" height="720" fill="url(#grid)" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1280" height="6" fill="#38BDF8" />

  <!-- Header Section -->
  <g transform="translate(64, 58)">
    <text x="0" y="0" font-family="&#39;Segoe UI&#39;, Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2.5" fill="#38BDF8">LUMIERE GPU ARCHITECTURE</text>
    <text x="0" y="42" font-family="&#39;Segoe UI&#39;, Inter, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#F8FAFC">Scalable Compute Cluster</text>
    <text x="0" y="72" font-family="&#39;Segoe UI&#39;, Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#94A3B8">Low-cost, PCIe-free shader scaling over 100GbE / RDMA</text>
  </g>

  <!-- Left Panel: Architecture Diagram Container -->
  <rect x="64" y="162" width="590" height="496" rx="16" fill="#0F172A" stroke="#1E293B" stroke-width="2" />

  <!-- Diagram Elements -->
  <g transform="translate(94, 186)">
    <!-- 1. Host Computer / DDR5 -->
    <rect x="40" y="0" width="270" height="52" rx="8" fill="url(#hostGrad)" stroke="#60A5FA" stroke-width="1.5" />
    <text x="175" y="31" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Inter, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Host Computer / DDR5</text>

    <!-- Link: Host to Switch -->
    <line x1="175" y1="52" x2="175" y2="104" stroke="#38BDF8" stroke-width="2.5" />
    <circle cx="175" cy="52" r="4" fill="#38BDF8" />
    <circle cx="175" cy="104" r="4" fill="#38BDF8" />
    <rect x="187" y="64" width="136" height="26" rx="13" fill="#0284C7" fill-opacity="0.25" stroke="#38BDF8" stroke-width="1" />
    <text x="255" y="81" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace" font-size="13" font-weight="700" fill="#7DD3FC">100GbE / RDMA</text>

    <!-- 2. QSFP28 Switch (Optional) -->
    <rect x="65" y="104" width="220" height="52" rx="8" fill="url(#switchGrad)" stroke="#818CF8" stroke-width="1.5" stroke-dasharray="6,3" />
    <text x="175" y="135" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Inter, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">QSFP28 Switch</text>
    <rect x="215" y="94" width="76" height="20" rx="10" fill="#4F46E5" stroke="#A5B4FC" stroke-width="1" />
    <text x="253" y="108" text-anchor="middle" font-family="&#39;Segoe UI&#39;, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">OPTIONAL</text>

    <!-- Bus Lines from Switch -->
    <path d="M 105 156 L 105 418 L 165 418" fill="none" stroke="#34D399" stroke-width="2" />
    <circle cx="105" cy="156" r="3" fill="#818CF8" />
    <circle cx="165" cy="418" r="3.5" fill="#34D399" />

    <path d="M 140 156 L 140 356 L 185 356" fill="none" stroke="#34D399" stroke-width="2" />
    <circle cx="140" cy="156" r="3" fill="#818CF8" />
    <circle cx="185" cy="356" r="3.5" fill="#34D399" />

    <path d="M 175 156 L 175 294 L 205 294" fill="none" stroke="#34D399" stroke-width="2" />
    <circle cx="175" cy="156" r="3" fill="#818CF8" />
    <circle cx="205" cy="294" r="3.5" fill="#34D399" />

    <path d="M 210 156 L 210 232 L 225 232" fill="none" stroke="#34D399" stroke-width="2" />
    <circle cx="210" cy="156" r="3" fill="#818CF8" />
    <circle cx="225" cy="232" r="3.5" fill="#34D399" />

    <path d="M 245 156 L 245 186 L 265 186" fill="none" stroke="#C084FC" stroke-width="2" />
    <circle cx="245" cy="156" r="3" fill="#818CF8" />
    <circle cx="265" cy="186" r="3.5" fill="#C084FC" />

    <!-- 3. Core Node / VRAM / HDMI (Optional) -->
    <g transform="translate(265, 166)">
      <rect x="0" y="0" width="255" height="42" rx="7" fill="url(#coreGrad)" stroke="#C084FC" stroke-width="1.5" stroke-dasharray="5,3" />
      <text x="127" y="26" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Inter, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Core Node / VRAM / HDMI</text>
      <rect x="184" y="-9" width="68" height="18" rx="9" fill="#7E22CE" stroke="#E9D5FF" stroke-width="1" />
      <text x="218" y="3" text-anchor="middle" font-family="&#39;Segoe UI&#39;, sans-serif" font-size="9.5" font-weight="700" fill="#FFFFFF">OPTIONAL</text>
    </g>

    <!-- 4. Shader Nodes -->
    <g transform="translate(225, 212)">
      <rect x="0" y="0" width="180" height="40" rx="7" fill="url(#shaderGrad)" stroke="#34D399" stroke-width="1.5" />
      <text x="90" y="25" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Inter, sans-serif" font-size="14.5" font-weight="700" fill="#FFFFFF">Shader Node</text>
    </g>
    <g transform="translate(205, 274)">
      <rect x="0" y="0" width="180" height="40" rx="7" fill="url(#shaderGrad)" stroke="#34D399" stroke-width="1.5" />
      <text x="90" y="25" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Inter, sans-serif" font-size="14.5" font-weight="700" fill="#FFFFFF">Shader Node</text>
    </g>
    <g transform="translate(185, 336)">
      <rect x="0" y="0" width="180" height="40" rx="7" fill="url(#shaderGrad)" stroke="#34D399" stroke-width="1.5" />
      <text x="90" y="25" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Inter, sans-serif" font-size="14.5" font-weight="700" fill="#FFFFFF">Shader Node</text>
    </g>
    <g transform="translate(165, 398)">
      <rect x="0" y="0" width="180" height="40" rx="7" fill="url(#shaderGrad)" stroke="#34D399" stroke-width="1.5" />
      <text x="90" y="25" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Inter, sans-serif" font-size="14.5" font-weight="700" fill="#FFFFFF">Shader Node</text>
    </g>
  </g>

  <!-- Right Panel: Concise Overview, Pricing & Performance -->
  <g transform="translate(686, 162)">
    
    <!-- Section 1: Node Cost (2-Column Cards) -->
    <text x="0" y="20" font-family="&#39;Segoe UI&#39;, Inter, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5" fill="#38BDF8">NODE PRICING</text>
    
    <!-- Core Node Price Card -->
    <g transform="translate(0, 34)">
      <rect x="0" y="0" width="256" height="86" rx="12" fill="#1E293B" fill-opacity="0.85" stroke="#A855F7" stroke-width="1.5" />
      <text x="20" y="30" font-family="&#39;Segoe UI&#39;, Inter, sans-serif" font-size="15" font-weight="600" fill="#E9D5FF">Core Node</text>
      <text x="20" y="66" font-family="&#39;Segoe UI&#39;, Inter, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF">$300</text>
      <text x="115" y="64" font-family="&#39;Segoe UI&#39;, Inter, sans-serif" font-size="13" fill="#94A3B8">/ unit</text>
    </g>

    <!-- Shader Node Price Card -->
    <g transform="translate(274, 34)">
      <rect x="0" y="0" width="256" height="86" rx="12" fill="#1E293B" fill-opacity="0.85" stroke="#10B981" stroke-width="1.5" />
      <text x="20" y="30" font-family="&#39;Segoe UI&#39;, Inter, sans-serif" font-size="15" font-weight="600" fill="#A7F3D0">Shader Node</text>
      <text x="20" y="66" font-family="&#39;Segoe UI&#39;, Inter, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF">$200</text>
      <text x="115" y="64" font-family="&#39;Segoe UI&#39;, Inter, sans-serif" font-size="13" fill="#94A3B8">/ unit</text>
    </g>

    <!-- Section 2: Performance per Shader Node -->
    <text x="0" y="156" font-family="&#39;Segoe UI&#39;, Inter, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5" fill="#38BDF8">COMPUTE PERFORMANCE</text>

    <!-- ASIC Performance Card -->
    <g transform="translate(0, 170)">
      <rect x="0" y="0" width="530" height="72" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" />
      <rect x="20" y="24" width="76" height="24" rx="6" fill="#0284C7" fill-opacity="0.3" stroke="#38BDF8" stroke-width="1" />
      <text x="58" y="40" text-anchor="middle" font-family="&#39;Segoe UI&#39;, sans-serif" font-size="12" font-weight="700" fill="#7DD3FC">ASIC</text>
      <text x="114" y="43" font-family="&#39;Segoe UI&#39;, Inter, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">7.0 TFLOPS <tspan font-size="15" font-weight="400" fill="#94A3B8">per Shader Node</tspan></text>
    </g>

    <!-- FPGA Performance Card -->
    <g transform="translate(0, 256)">
      <rect x="0" y="0" width="530" height="72" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.5" />
      <rect x="20" y="24" width="76" height="24" rx="6" fill="#059669" fill-opacity="0.3" stroke="#34D399" stroke-width="1" />
      <text x="58" y="40" text-anchor="middle" font-family="&#39;Segoe UI&#39;, sans-serif" font-size="12" font-weight="700" fill="#A7F3D0">FPGA</text>
      <text x="114" y="43" font-family="&#39;Segoe UI&#39;, Inter, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">64 GFLOPS <tspan font-size="15" font-weight="400" fill="#94A3B8">per Shader Node</tspan></text>
    </g>

    <!-- Section 3: Compact Architecture Notes -->
    <g transform="translate(0, 358)">
      <line x1="0" y1="0" x2="530" y2="0" stroke="#334155" stroke-width="1" />
      
      <circle cx="10" cy="28" r="4" fill="#C084FC" />
      <text x="24" y="33" font-family="&#39;Segoe UI&#39;, Inter, sans-serif" font-size="15" fill="#E2E8F0"><tspan font-weight="700" fill="#FFFFFF">Core Node</tspan> supports <tspan font-weight="700" fill="#E9D5FF">HDMI display output</tspan> on graphics config.</text>

      <circle cx="10" cy="62" r="4" fill="#34D399" />
      <text x="24" y="67" font-family="&#39;Segoe UI&#39;, Inter, sans-serif" font-size="15" fill="#E2E8F0"><tspan font-weight="700" fill="#FFFFFF">FPGA Target:</tspan> 500 MHz on XCKU5P (-2 speed grade).</text>

      <circle cx="10" cy="96" r="4" fill="#38BDF8" />
      <text x="24" y="101" font-family="&#39;Segoe UI&#39;, Inter, sans-serif" font-size="15" fill="#E2E8F0"><tspan font-weight="700" fill="#FFFFFF">Zero PCIe & Switchless:</tspan> Direct 100GbE host connection.</text>
    </g>

  </g>

  <!-- Footer -->
  <text x="64" y="692" font-family="&#39;Segoe UI&#39;, Inter, sans-serif" font-size="13" fill="#64748B">Lumiere GPU — Scalable Compute Cluster Overview</text>
  <text x="1216" y="692" text-anchor="end" font-family="&#39;Consolas&#39;, monospace" font-size="13" fill="#64748B">100GbE / RDMA • 500 MHz FPGA</text>
</svg>