<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440">
    <defs>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.08"/>
        </filter>
        <marker id="arr-sky" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
        </marker>
        <marker id="arr-vio" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed"/>
        </marker>
        <marker id="arr-em" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
        </marker>
        <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
        </marker>
    </defs>
    <style><![CDATA[
        text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
        .t-title { font-size: 18px; font-weight: 700; fill: #0f172a; }
        .t-sub { font-size: 11.5px; font-weight: 500; fill: #475569; }
        .t-sec { font-size: 11px; font-weight: 700; letter-spacing: 0.6px; fill: #334155; }
        .t-su { font-size: 10.5px; font-weight: 700; fill: #0c4a6e; }
        .t-susub { font-size: 8px; font-weight: 600; fill: #0369a1; }
        .t-rt { font-size: 9px; font-weight: 700; fill: #4c1d95; }
        .t-rep { font-size: 8px; font-weight: 700; fill: #92400e; }
        .t-box { font-size: 10px; font-weight: 700; fill: #1e293b; }
        .t-boxsub { font-size: 8.5px; font-weight: 500; fill: #475569; }
    ]]></style>
    <rect width="760" height="440" fill="#f8fafc" rx="10"/>
    <text class="t-title" x="24" y="30">Amaterrace GPU 2D Floorplan — N = 1 SU (1x1 Tile, atg_su_fabric_n1)</text>
    <text class="t-sub" x="24" y="48">1x1 Grid | 1 Spine Trunk | ASIC: Unified Fat-Tree (0 rep hops) | FPGA minimal: Crossbar mode (atg_mc_tree)</text>
    <rect x="24" y="64" width="712" height="175" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <rect x="140" y="95" width="160" height="74" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.3" filter="url(#shadow)"/>
    <text class="t-su" x="220.0" y="127.56" text-anchor="middle">SU 0</text>
    <text class="t-susub" x="220.0" y="151.24" text-anchor="middle">rt2(D$+I$)</text>
    <line x1="220" y1="169" x2="220" y2="212" stroke="#059669" stroke-width="2"/>
    <line x1="220" y1="212" x2="380" y2="212" stroke="#059669" stroke-width="2"/>
    <line x1="380" y1="212" x2="380" y2="276" stroke="#059669" stroke-width="2" marker-end="url(#arr-em)"/>
    <text x="300" y="205" text-anchor="middle" font-size="9" font-weight="600" fill="#047857">Direct Trunk 0 (0 rep hops)</text>
    <rect x="420" y="88" width="290" height="90" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2" stroke-dasharray="4,2"/>
    <text x="565" y="108" text-anchor="middle" font-size="10" font-weight="700" fill="#9a3412">Target Platform Switch (menuconfig #1)</text>
    <text x="565" y="126" text-anchor="middle" font-size="9" fill="#c2410c">• ASIC (compute/gfx-*-su1): USE_NOC_FABRIC = 1</text>
    <text x="565" y="141" text-anchor="middle" font-size="9" fill="#c2410c">  SU0 local rt2 -&gt; Unified Fat-Tree Root</text>
    <text x="565" y="158" text-anchor="middle" font-size="9" fill="#c2410c">• FPGA (*-fpga-test-minimal): USE_NOC_FABRIC = 0</text>
    <text x="565" y="172" text-anchor="middle" font-size="9" fill="#c2410c">  Flat 2-cyc Crossbar (atg_mc_tree)</text>
    <!-- SPINE & MC ROOT -->
    <rect x="24" y="252" width="712" height="165" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <text class="t-sec" x="38" y="270">SPINE &amp; ROOT NOC (SOUTH DIE EDGE) — 1 SU TRUNK(S) TO ATG_MMU + FIXED-FUNC SUBTREE + DC ROOT</text>
    <rect x="179.0" y="278" width="402" height="32" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="380.0" y="292" text-anchor="middle" font-size="9.5" font-weight="700" fill="#065f46">Spine MMU Boundary: 1x SU Trunks + VF/TU/ROP/BLT -&gt; atg_mmu (L1+L2 TLB+Walker)</text>
    <text x="380.0" y="304" text-anchor="middle" font-size="8.5" fill="#047857">UNIT_ADDR_W (VA 30..40b inside SU Fabric)  ==&gt;  MC_ADDR_W (PA 40..48b after MMU)</text>
    <rect x="38" y="278" width="132" height="58" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="104" y="294" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1d4ed8">Fixed-Func Subtree</text>
    <text x="104" y="307" text-anchor="middle" font-size="8" fill="#1e40af">VF, TU, ROP, BLT</text>
    <text x="104" y="319" text-anchor="middle" font-size="8" fill="#1e40af">atg_rt4_fixed -> Root</text>
    <text x="104" y="330" text-anchor="middle" font-size="7.5" fill="#2563eb">(0 in compute-only)</text>
    <rect x="38" y="344" width="132" height="62" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="104" y="360" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5b21b6">Shared Spine PT (Opt I)</text>
    <text x="104" y="372" text-anchor="middle" font-size="8" fill="#6d28d9">atg_su_pt + warp_dist</text>
    <text x="104" y="384" text-anchor="middle" font-size="8" fill="#6d28d9">gfx_rt (tx/ex) + atom_rt</text>
    <text x="104" y="396" text-anchor="middle" font-size="7.5" fill="#7c3aed">All 1 SUs run 3D/Compute</text>
    <rect x="590" y="278" width="132" height="58" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.3" stroke-dasharray="4,2"/>
    <text x="656" y="295" text-anchor="middle" font-size="9.5" font-weight="700" fill="#854d0e">Reserved SA Slot</text>
    <text x="656" y="308" text-anchor="middle" font-size="8" fill="#a16207">Future Systolic GEMM</text>
    <text x="656" y="320" text-anchor="middle" font-size="8" fill="#a16207">Independent NoC Node</text>
    <text x="656" y="331" text-anchor="middle" font-size="7.5" fill="#b45309">(Stub when HAS_SA=0)</text>
    <rect x="590" y="344" width="132" height="62" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.3"/>
    <text x="656" y="360" text-anchor="middle" font-size="9.5" font-weight="700" fill="#9f1239">Root Priority Nodes</text>
    <text x="656" y="373" text-anchor="middle" font-size="8" fill="#be123c">CP + RV32 FW (PRIO=1)</text>
    <text x="656" y="385" text-anchor="middle" font-size="8" fill="#be123c">DC Scanout (s_* direct)</text>
    <text x="656" y="397" text-anchor="middle" font-size="7.5" fill="#9f1239">Walker 0xFE -&gt; L2/AXI</text>
    <rect x="230.0" y="318" width="300" height="32" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="380.0" y="337" text-anchor="middle" font-size="10" font-weight="700" fill="#4c1d95">Root Fat-Tree Arbiter (CP + Fixed + SU Trunks + SA)</text>
    <rect x="200.0" y="360" width="360" height="46" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
    <text x="380.0" y="379" text-anchor="middle" font-size="10.5" font-weight="700" fill="#f8fafc">atg_mc (L2 Cache + Session PROT + Aperture)</text>
    <text x="380.0" y="395" text-anchor="middle" font-size="8.5" fill="#94a3b8">External AXI4 Master (m_awaddr / m_araddr [PA_BITS]) — 0/1 ID Local/Host</text>
    <line x1="380.0" y1="310" x2="380.0" y2="318" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-em)"/>
    <line x1="380.0" y1="350" x2="380.0" y2="360" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-vio)"/>
    <line x1="170" y1="307" x2="179.0" y2="296" stroke="#0284c7" stroke-width="1.4" marker-end="url(#arr-sky)"/>
    <line x1="590" y1="307" x2="581.0" y2="296" stroke="#ca8a04" stroke-width="1.3" stroke-dasharray="3,2"/>
    <line x1="590" y1="374" x2="530.0" y2="336" stroke="#e11d48" stroke-width="1.5" marker-end="url(#arr-vio)"/>
</svg>