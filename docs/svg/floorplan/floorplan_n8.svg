    <text x="104" y="389" text-anchor="middle" font-size="8" fill="#1e40af">atg_rt4_fixed -> Root</text>
    <text x="104" y="400" text-anchor="middle" font-size="7.5" fill="#2563eb">(0 in compute-only)</text>
    <rect x="38" y="414" width="132" height="62" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.2"/>
