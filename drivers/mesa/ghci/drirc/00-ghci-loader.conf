<?xml version="1.0" standalone="yes"?>
<!--
  GHCI GPU Driver
  Copyright (C) 2026 Awe Morris
  SPDX-License-Identifier: Zlib

  The GHCI GPU has a Vulkan driver and no Gallium driver: make the Mesa
  loader (EGL, GBM, GLX) use Zink for the ghci kernel driver, instead of
  failing to find a "ghci" Gallium driver first.
-->
<driconf>
    <device driver="loader" kernel_driver="ghci">
        <application name="Default">
            <option name="dri_driver" value="zink" />
        </application>
    </device>
</driconf>
